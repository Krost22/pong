<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden"></div>
    <button id="btn-pause" class="corner hidden" aria-label="Pausa">II</button>
    <div id="msg" class="hidden"></div>

    <section id="menu" class="overlay">
      <h1>PONG</h1>
      <div class="modes">
        <button class="selected" data-game="pong">PONG</button>
        <button data-game="krostnoid">KROSTNOID</button>
        <button data-game="roguelike">ROGUELIKE</button>
      </div>
      <div id="row-mode" class="modes">
        <button class="selected" data-mode="com">1 JUGADOR vs COM</button>
        <button data-mode="2p">2 JUGADORES</button>
      </div>
      <div id="row-style" class="modes">
        <button class="selected" data-style="classic">CLÁSICO</button>
        <button data-style="modern">MODERNO</button>
      </div>
      <p id="game-info" class="info hidden"></p>
      <div class="modes">
        <button id="btn-continue" class="big hidden">CONTINUAR</button>
        <button id="btn-start" class="big">INICIO</button>
        <button id="btn-quit" class="big">SALIR</button>
      </div>
      <p class="help">
        <span id="help-touch"></span><br>
        <span id="help-keys"></span><br>
        <span id="help-goal">Gana el primero en llegar a 11</span>
      </p>
      <p id="version" class="help"></p>
      <p id="quit-msg" class="help hidden">Cierra la pestaña para salir.</p>
      <p class="credit">krostgames - 2026</p>
    </section>

    <section id="pause" class="overlay translucent hidden">
      <h2>PAUSA</h2>
      <button id="btn-resume" class="big">SEGUIR</button>
      <button id="btn-new">JUEGO NUEVO</button>
      <button id="btn-exit">SALIR</button>
    </section>

    <!-- RogueLike: mapa, cartas, tienda y descanso (lo rellena roguelike.js) -->
    <section id="rogue" class="overlay translucent hidden">
      <h2 id="rogue-title"></h2>
      <p id="rogue-sub" class="info"></p>
      <div id="rogue-map" class="rogue-map hidden"></div>
      <div id="rogue-items" class="cards"></div>
      <p id="rogue-note" class="help"></p>
      <div id="rogue-actions" class="modes"></div>
    </section>

    <section id="over" class="overlay translucent hidden">
      <h2 id="winner"></h2>
      <p id="final"></p>
      <p id="record-line" class="hidden"></p>
      <ol id="board" class="hidden"></ol>
      <div class="modes">
        <button id="btn-again" class="big">JUEGO NUEVO</button>
        <button id="btn-over-exit" class="big">SALIR</button>
      </div>
    </section>
  </div>
  <script src="version.js"></script>
  <script src="audio.js"></script>
  <script src="powerups.js"></script>
  <script src="modern.js"></script>
  <script src="krostnoid.js"></script>
  <script src="roguelike.js"></script>
  <script src="game.js"></script>
</body>
</html>
